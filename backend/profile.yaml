# Your candidate profile. decide.py takes every threshold from here - restart the backend after editing.

# ── Experience ────────────────────────────────────────────────────────────────────────────────────
experience_years: 1.5          # SET THIS: your years of work experience
experience_tolerance: 0.5      # accept jobs asking for up to experience_years + this many years
                               # -> 1.5 + 0.5 = jobs whose MINIMUM is at most 2 years ("0-2", "1-3", "2+" pass;
                               #    "3-5", "5+", "8-11" are rejected) on every site: LinkedIn, Naukri, Indeed, Glassdoor
                               # (and jobs capped below experience_years - this, here under 1 year, are "overqualified")

# ── The positions you want (position first: skills never reject a job) ──────────────────────────
# Only these role types are wanted. Every other type is unwanted and rejected when the AI is sure
# (its probabilities for unwanted types add up to >= reject_confidence), however well the skills match.
# All types: ai_ml_engineering, data_science, data_engineering, backend_software, data_analytics,
#            qa_testing, devops_cloud_it, other_engineering, teaching_training, ai_data_annotation,
#            internship, research_academic, non_technical
# ("unclear" is never wanted nor unwanted: an unclear title goes on to the job-description stage.)
target_role_families: [ai_ml_engineering, data_science, data_engineering]

# ── Seniority: OFF ──────────────────────────────────────────────────────────────────────────────
# Seniority words in the title (Senior, Lead, Manager, ...) do NOT reject a job - you skip those yourself
# when applying. Too many YEARS still rejects (experience_years + experience_tolerance above).
# To turn the seniority filter back on, uncomment the last line and list the levels you accept
# (entry, mid, senior, lead_plus). They are read from the title words, no AI (checked before the AI is
# asked, so a too-senior title costs nothing):
#   lead_plus = lead, principal, staff, architect, manager, head, director, VP, AVP, SVP, EVP, vice president, chief
#   senior    = senior, sr, grade III / IV ("Data Scientist III")
#   entry     = junior, jr, fresher, graduate, trainee, associate, entry level
#   mid       = none of those words
# allowed_seniority: [entry, mid]

# ── Thresholds ────────────────────────────────────────────────────────────────────────────────────
reject_confidence: 0.6         # only reject on a role answer whose unwanted probability is >= this (0-1);
                               # below it the job stays visible ("when in doubt, show it")
# Match score (0-10) in jobs.xlsx = position (0-5: how surely it is a wanted role type)
#                                 + skills   (0-5: how well your skills below cover the job's core skills).
# It only sorts the matches; it never rejects a job (skills can be learned).

# ── Your skills ───────────────────────────────────────────────────────────────────────────────────
# The JD stage asks how well these cover the core skills each job requires.
skills: [Machine Learning, Deep Learning, Artificial Intelligence, Natural Language Processing, Large Language Models, Generative AI, Retrieval Augmented Generation, LLM Fine-Tuning, LoRA, QLoRA, PEFT, Hugging Face, Transformers, Data Analysis, Data Scientist, Python, TensorFlow, PyTorch, Scikit-Learn, NumPy, Pandas, LangChain, FastAPI, MongoDB, REST APIs, AWS, Docker, DVC, MLflow, ONNX, MLOps, Git]
